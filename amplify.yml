version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -d "web" ]; then cd web; fi
        - npm ci
    build:
      commands:
        - if [ -d "web" ]; then cd web; fi
        - npm run build
  artifacts:
    baseDirectory: web/.next
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
      - web/.next/cache/**/*
